spring.application.name=zeladoria-cidada
server.port=${PORT:8080}

# Banco Oracle da FIAP. Credenciais SOMENTE por variáveis de ambiente (nunca no repositório).
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool pequeno: o banco acadêmico limita conexões simultâneas.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
# A aplicação sobe mesmo se o banco estiver indisponível no start; as chamadas passam a falhar com 500 tratado.
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

server.error.include-message=never
server.error.include-stacktrace=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
